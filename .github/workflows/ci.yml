name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each step runs even if an earlier one failed, so one push shows every
      # problem at once rather than one per round trip.
      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Typecheck and build
        if: '!cancelled()'
        run: npm run build

      - name: Test
        if: '!cancelled()'
        run: npm test
