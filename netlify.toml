# Deploy config for retirementplanner.grahamjenkinson.com
#
# Works as-is on Netlify. Cloudflare Pages needs the same two values entered
# in its UI: build command and output directory. The project sits at the repo
# root, so neither host needs a base/root directory set.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single page app: every path serves the same document.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The app stores everything in the browser and calls nothing external, so the
# policy can be strict enough to prove it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
